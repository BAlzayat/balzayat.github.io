<h3>Integral Domain</h3><p>A commutative <a href="/defs/def/ring.html" class="definition">Ring</a> that has no zero divisors, that is, if <span class="math_inline"><img src="/tex/88.svg" style="width:3.65em;height:0.97em;vertical-align:-0.03em" alt="$ab = 0$"></span> then <span class="math_inline"><img src="/tex/89.svg" style="width:3.09em;height:0.93em;vertical-align:-0.03em" alt="$a = 0$"></span> or <span class="math_inline"><img src="/tex/90.svg" style="width:2.96em;height:0.97em;vertical-align:-0.03em" alt="$b = 0$"></span>.</p>
