<h3>Unique Factorization Domain</h3><p>An <a href="/defs/def/integral_domain.html" class="definition">Integral Domain</a> in which every non zero, non <a href="/defs/def/unit.html" class="definition">unit</a> element can be uniquely factored into irreducible elements up to <a href="/defs/def/unit.html" class="definition">units</a> and the order of elements.</p>
