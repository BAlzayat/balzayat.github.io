<h3>Ring</h3><p>A set <span class="math_inline"><img src="/tex/77.svg" style="width:1.00em;height:0.95em;vertical-align:-0.03em" alt="$R$"></span> with two operations <span class="math_inline"><img src="/tex/82.svg" style="width:0.96em;height:0.88em;vertical-align:-0.10em" alt="$+$"></span> and <span class="math_inline"><img src="/tex/85.svg" style="width:0.26em;height:0.41em;vertical-align:0.00em" alt="$\cdot$"></span> such that:</p>
<ol>
<li><span class="math_inline"><img src="/tex/77.svg" style="width:1.00em;height:0.95em;vertical-align:-0.03em" alt="$R$"></span> is an abelian group under <span class="math_inline"><img src="/tex/82.svg" style="width:0.96em;height:0.88em;vertical-align:-0.10em" alt="$+$"></span>.</li>
<li><span class="math_inline"><img src="/tex/85.svg" style="width:0.26em;height:0.41em;vertical-align:0.00em" alt="$\cdot$"></span> is associative and has an identity.</li>
<li><span class="math_inline"><img src="/tex/85.svg" style="width:0.26em;height:0.41em;vertical-align:0.00em" alt="$\cdot$"></span> distributes over <span class="math_inline"><img src="/tex/82.svg" style="width:0.96em;height:0.88em;vertical-align:-0.10em" alt="$+$"></span>, that is <span class="math_inline"><img src="/tex/86.svg" style="width:13.38em;height:1.36em;vertical-align:-0.34em" alt="$a \cdot (b+c) = a \cdot b + a \cdot c$"></span>, and <span class="math_inline"><img src="/tex/87.svg" style="width:13.34em;height:1.36em;vertical-align:-0.34em" alt="$(b + c) \cdot a = b \cdot a + c \cdot a$"></span></li>
</ol>
