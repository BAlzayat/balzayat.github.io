        <h1>Principal Ideal</h1>
<p>An <a href="/defs/def/ideal.html" class="definition">Ideal</a> <span class="math_inline"><img src="/tex/73.svg" style="width:0.65em;height:0.93em;vertical-align:0.00em" alt="$I$"></span> in which every element is of the form <span class="math_inline"><img src="/tex/74.svg" style="width:1.29em;height:0.61em;vertical-align:-0.01em" alt="$ra$"></span> for some fixed <span class="math_inline"><img src="/tex/75.svg" style="width:0.66em;height:0.61em;vertical-align:-0.01em" alt="$a$"></span>, called the generator of <span class="math_inline"><img src="/tex/73.svg" style="width:0.65em;height:0.93em;vertical-align:0.00em" alt="$I$"></span>. We write <span class="math_inline"><img src="/tex/76.svg" style="width:4.08em;height:1.36em;vertical-align:-0.34em" alt="$I = \langle a \rangle$"></span></p>
